apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeserver-reverse-proxy
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homeserver-reverse-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeserver-reverse-proxy
        app.kubernetes.io/part-of: homeserver-gitops
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              hostPort: 4445
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: homeserver-reverse-proxy-config
