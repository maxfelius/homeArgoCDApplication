apiVersion: v1
kind: ConfigMap
metadata:
  name: homeserver-reverse-proxy-config
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
data:
  nginx.conf: |
    events {}

    http {
      server {
        listen 8080;
        server_name _;

        location = / {
          return 200 "homeserver reverse proxy is running\nAvailable routes:\n- /speedtest/\n";
          add_header Content-Type text/plain;
        }

        location = /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        location = /speedtest {
          return 308 /speedtest/;
        }

        location /speedtest/ {
          proxy_pass http://homeserver-service.homeserver.svc.cluster.local:1234/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /speedtest;
        }
      }
    }
