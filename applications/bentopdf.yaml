apiVersion: v1
kind: ConfigMap
metadata:
  name: bentopdf-nginx-config
  labels:
    app.kubernetes.io/name: bentopdf
    app.kubernetes.io/part-of: homeserver-gitops
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      types {
        application/javascript mjs;
      }
      default_type application/octet-stream;

      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/wasm;

      server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location = /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        location = /pdf {
          return 308 /pdf/;
        }

        location /pdf/ {
          try_files $uri $uri/ $uri.html /pdf/index.html;
          expires 5m;
        }

        location ~* ^/pdf/.*\.(js|mjs|css|woff|woff2|ttf|eot|otf)$ {
          try_files $uri =404;
          expires 5m;
          add_header Cache-Control "no-cache" always;
          add_header Cross-Origin-Opener-Policy "same-origin" always;
          add_header Cross-Origin-Embedder-Policy "credentialless" always;
          add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        location ~* ^/pdf/.*\.(wasm|wasm\.gz|data|data\.gz)$ {
          try_files $uri =404;
          expires 1y;
          add_header Cross-Origin-Opener-Policy "same-origin" always;
          add_header Cross-Origin-Embedder-Policy "credentialless" always;
          add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        location ~* ^/pdf/.*\.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp4|webm|pdf|json)$ {
          try_files $uri =404;
          expires 1w;
          add_header Cross-Origin-Opener-Policy "same-origin" always;
          add_header Cross-Origin-Embedder-Policy "credentialless" always;
          add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bentopdf
  labels:
    app.kubernetes.io/name: bentopdf
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bentopdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bentopdf
        app.kubernetes.io/part-of: homeserver-gitops
    spec:
      initContainers:
        - name: prepare-site
          image: ghcr.io/alam00000/bentopdf-simple:v2.8.7
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /site/pdf
              cp -a /usr/share/nginx/html/. /site/pdf/
              # The upstream self-hosted image is built for /. Rebase common
              # absolute static URLs so the app works under /pdf/.
              find /site/pdf -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -print0 \
                | xargs -0 sed -i \
                  -e 's#"/assets/#"/pdf/assets/#g' \
                  -e "s#'/assets/#'/pdf/assets/#g" \
                  -e 's#"/images/#"/pdf/images/#g' \
                  -e "s#'/images/#'/pdf/images/#g" \
                  -e 's#"/pdfjs-viewer/#"/pdf/pdfjs-viewer/#g' \
                  -e "s#'/pdfjs-viewer/#'/pdf/pdfjs-viewer/#g" \
                  -e 's#"/pdfjs-annotation-viewer/#"/pdf/pdfjs-annotation-viewer/#g' \
                  -e "s#'/pdfjs-annotation-viewer/#'/pdf/pdfjs-annotation-viewer/#g" \
                  -e 's#"/libreoffice-wasm/#"/pdf/libreoffice-wasm/#g' \
                  -e "s#'/libreoffice-wasm/#'/pdf/libreoffice-wasm/#g" \
                  -e 's#"/favicon.ico#"/pdf/favicon.ico#g' \
                  -e "s#'/favicon.ico#'/pdf/favicon.ico#g" \
                  -e 's#href:`/#href:`/pdf/#g' \
                  -e 's#href="/"#href="/pdf/"#g'
              find /site/pdf -type f -name '*.html' -print0 \
                | xargs -0 sed -i -E \
                  's#(/pdf/assets/[^" ]+\.(js|css))#\1?v=pdf-tools-v2#g'
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: bentopdf
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: site
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: bentopdf-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: bentopdf
  labels:
    app.kubernetes.io/name: bentopdf
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bentopdf
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
