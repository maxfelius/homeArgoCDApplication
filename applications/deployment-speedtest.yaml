apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeserver-deployment
spec:
  selector:
    matchLabels:
      app: homeserver-speedtest
  replicas: 1
  template:
    metadata:
      labels:
        app: homeserver-speedtest
    spec:
      containers:
      - name: speedtest
        image: henrywhitaker3/speedtest-tracker
        ports:
        - containerPort: 80
        env:
        - name: TZ
          value: "UTC"
        - name: PGID
          value: "1000" 
        - name: PUID
          value: "1000"
        - name: OOKLA_EULA_GDPR
          value: "true"
        - name: BASE_PATH
          value: "/speedtest"
        readinessProbe:
          httpGet:
            path: /speedtest/
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - '! ps aux | grep -F "/config/www/app/Bin/speedtest" | grep -v grep >/dev/null'
          initialDelaySeconds: 300
          periodSeconds: 300
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        hostPath:
          path: /home/max/Documents/max/data/speedtest
          type: DirectoryOrCreate
