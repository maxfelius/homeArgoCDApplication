apiVersion: apps/v1
kind: Deployment
metadata:
  name: hortusfox-db
  labels:
    app.kubernetes.io/name: hortusfox-db
    app.kubernetes.io/part-of: homeserver-gitops
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hortusfox-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hortusfox-db
        app.kubernetes.io/part-of: homeserver-gitops
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "my-secret-pw"
            - name: MARIADB_DATABASE
              value: "hortusfox"
            - name: MARIADB_USER
              value: "user"
            - name: MARIADB_PASSWORD
              value: "password"
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          hostPath:
            path: /home/max/homeserver-data/hortusfox/db
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: hortusfox-db
  labels:
    app.kubernetes.io/name: hortusfox-db
    app.kubernetes.io/part-of: homeserver-gitops
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hortusfox-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hortusfox
  labels:
    app.kubernetes.io/name: hortusfox
    app.kubernetes.io/part-of: homeserver-gitops
    app.kubernetes.io/component: web
  annotations:
    homeserver.maxfelius.nl/credentials-note: "Uses HortusFox upstream demo credentials by explicit request; change them immediately after first login."
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hortusfox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hortusfox
        app.kubernetes.io/part-of: homeserver-gitops
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: hortusfox
          image: ghcr.io/danielbrendel/hortusfox-web:v5.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: APP_ADMIN_EMAIL
              value: "admin@example.com"
            - name: APP_ADMIN_PASSWORD
              value: "password"
            - name: APP_TIMEZONE
              value: "Europe/Amsterdam"
            - name: APP_BASE_DIR
              value: "/hortusfox"
            - name: APP_DEBUG
              value: "true"
            - name: DB_HOST
              value: "hortusfox-db"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "hortusfox"
            - name: DB_USERNAME
              value: "user"
            - name: DB_PASSWORD
              value: "password"
            - name: DB_CHARSET
              value: "utf8mb4"
          readinessProbe:
            httpGet:
              path: /auth
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /auth
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: images
              mountPath: /var/www/html/public/img
            - name: attachments
              mountPath: /var/www/html/public/attachments
            - name: logs
              mountPath: /var/www/html/app/logs
            - name: backup
              mountPath: /var/www/html/public/backup
            - name: themes
              mountPath: /var/www/html/public/themes
            - name: migrations
              mountPath: /var/www/html/app/migrations
      volumes:
        - name: images
          hostPath:
            path: /home/max/homeserver-data/hortusfox/images
            type: DirectoryOrCreate
        - name: attachments
          hostPath:
            path: /home/max/homeserver-data/hortusfox/attachments
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /home/max/homeserver-data/hortusfox/logs
            type: DirectoryOrCreate
        - name: backup
          hostPath:
            path: /home/max/homeserver-data/hortusfox/backup
            type: DirectoryOrCreate
        - name: themes
          hostPath:
            path: /home/max/homeserver-data/hortusfox/themes
            type: DirectoryOrCreate
        - name: migrations
          hostPath:
            path: /home/max/homeserver-data/hortusfox/migrations
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: hortusfox
  labels:
    app.kubernetes.io/name: hortusfox
    app.kubernetes.io/part-of: homeserver-gitops
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hortusfox
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
