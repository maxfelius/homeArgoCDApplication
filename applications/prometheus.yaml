apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: homeserver-gitops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-a-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: homeserver-gitops
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
            labels:
              node: max-server-auto
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter-a.monitoring.svc.cluster.local:9100"]
            labels:
              node: max-server-auto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-b-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: homeserver-gitops
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
