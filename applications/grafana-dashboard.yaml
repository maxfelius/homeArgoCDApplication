apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: homeserver-gitops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: homeserver-node-health
        orgId: 1
        folder: Homeserver
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/homeserver
---
