apiVersion: v1
kind: ConfigMap
metadata:
  name: homeserver-reverse-proxy-config
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
data:
  nginx.conf: |
    events {}

    http {
      server {
        listen 8080;
        server_name _;

        location = / {
          return 200 "homeserver reverse proxy is running\nAvailable routes:\n- /speedtest/\n";
          add_header Content-Type text/plain;
        }

        location = /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        location = /speedtest {
          return 308 $scheme://$http_host/speedtest/;
        }

        location /speedtest/ {
          proxy_pass http://homeserver-service.homeserver.svc.cluster.local:1234;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /speedtest;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeserver-reverse-proxy
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homeserver-reverse-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeserver-reverse-proxy
        app.kubernetes.io/part-of: homeserver-gitops
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              hostPort: 4445
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: homeserver-reverse-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeserver-reverse-proxy
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homeserver-reverse-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
