apiVersion: v1
kind: ConfigMap
metadata:
  name: homeserver-reverse-proxy-config
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
data:
  nginx.conf: |
    events {}

    http {
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

      server {
        listen 8080;
        server_name _;

        location = / {
          default_type text/html;
          return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homeserver</title><style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;line-height:1.5;color:#e5e7eb;background:#111827}a{color:#60a5fa;text-decoration:none}a:hover{text-decoration:underline}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:1.25rem}ul{padding-left:1.25rem}</style></head><body><h1>Homeserver</h1><div class="card"><h2>Applications</h2><ul><li><a href="/speedtest/">Speedtest Tracker</a></li><li><a href="/pdf/">BentoPDF</a></li><li><a href="/adguard/">AdGuard Home</a></li><li><a href="/hortusfox/">HortusFox</a></li></ul></div></body></html>';
        }

        location = /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        location = /speedtest {
          return 308 $scheme://$http_host/speedtest/;
        }

        location /speedtest/ {
          set $speedtest_upstream "homeserver-service.homeserver.svc.cluster.local:1234";
          proxy_pass http://$speedtest_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /speedtest;
        }

        location = /pdf {
          return 308 $scheme://$http_host/pdf/;
        }

        location /pdf/ {
          set $bentopdf_upstream "bentopdf.homeserver.svc.cluster.local:8080";
          proxy_pass http://$bentopdf_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Prefix /pdf;
        }

        location = /hortusfox {
          return 308 $scheme://$http_host/hortusfox/;
        }

        location /hortusfox/ {
          set $hortusfox_upstream "hortusfox.homeserver.svc.cluster.local:80";
          rewrite ^/hortusfox/(.*)$ /$1 break;
          proxy_pass http://$hortusfox_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Prefix /hortusfox;
          proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$http_host/hortusfox$1;
          proxy_redirect ~^(/.*)$ $scheme://$http_host/hortusfox$1;
          proxy_cookie_path / /hortusfox/;
        }

        # HortusFox frontend JavaScript contains root-relative AJAX and
        # navigation calls built from window.location.origin. Route only
        # HortusFox-owned root paths to the app so those actions continue
        # to work while the visible app entrypoint remains /hortusfox/.
        location ~ ^/(auth|login|logout|password|plants|profile|search|tasks|inventory|calendar|weather|chat|admin|attachments|snd|share|export|import|cronjob)(/|$) {
          set $hortusfox_upstream "hortusfox.homeserver.svc.cluster.local:80";
          proxy_pass http://$hortusfox_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $http_host;
        }

        location = /adguard {
          return 308 $scheme://$http_host/adguard/;
        }

        location /adguard/ {
          set $adguard_upstream "adguard-home.homeserver.svc.cluster.local:3000";
          rewrite ^/adguard/(.*)$ /$1 break;
          proxy_pass http://$adguard_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Prefix /adguard;
          proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$http_host/adguard$1;
          proxy_redirect ~^(/.*)$ $scheme://$http_host/adguard$1;
          proxy_cookie_path / /adguard/;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeserver-reverse-proxy
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homeserver-reverse-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeserver-reverse-proxy
        app.kubernetes.io/part-of: homeserver-gitops
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              hostPort: 4445
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: homeserver-reverse-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeserver-reverse-proxy
  labels:
    app.kubernetes.io/name: homeserver-reverse-proxy
    app.kubernetes.io/part-of: homeserver-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homeserver-reverse-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
